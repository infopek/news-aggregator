name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests, race, and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Run Go tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Check pull-request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  repository-verification:
    name: Full repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use repository-compatible npm
        run: npm install --global npm@11.6.2
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Run repository verification
        env:
          SCREENSHOT_MODE: smoke
        run: ./scripts/verify.sh

  contract-and-lifecycle:
    name: Contract, lifecycle, and enforcement checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            web/package-lock.json
      - name: Use repository-compatible npm
        run: npm install --global npm@11.6.2
      - name: Install pinned contract and frontend dependencies
        run: |
          npm --prefix scripts ci
          npm --prefix web ci
      - name: Enforce shared API and generated-client contracts
        env:
          SCREENSHOT_MODE: smoke
        run: ./scripts/contract.sh
      - name: Enforce task-batch and lifecycle consistency
        run: ./scripts/lifecycle-contract.sh
      - name: Require executed integration tests
        run: ./scripts/integration-contract.sh
      - name: Prove representative failures are rejected
        run: ./scripts/verify-enforcement-negatives.sh

  windows-build:
    name: Windows amd64 build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/news-aggregator.exe ./cmd/news-aggregator

  windows-native:
    name: Windows native packaging and runtime
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out repository into a path containing spaces
        uses: actions/checkout@v4
        with:
          path: News Aggregator Source
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: News Aggregator Source/go.mod
          cache-dependency-path: News Aggregator Source/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: News Aggregator Source/web/package-lock.json
      - name: Use repository-compatible npm
        shell: pwsh
        run: npm install --global npm@11.6.2
      - name: Run native Windows smoke verification
        shell: pwsh
        working-directory: News Aggregator Source
        run: ./packaging/windows/smoke.ps1
      - name: Upload executable and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/News Aggregator Native Smoke
          if-no-files-found: error
          retention-days: 14
